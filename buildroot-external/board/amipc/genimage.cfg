image amipc.img {
    hdimage {
        gpt = true
    }

    partition boot {
        partition-type-uuid = U
        bootable = "true"
        image = "efi-part.vfat"
        size = 64M
    }

    partition rootfs {
        partition-type-uuid = L
        image = "rootfs.ext4"
        size = 1500M
    }
}
