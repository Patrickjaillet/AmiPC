name: Publication du site web

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Mise à jour du numéro de version affiché
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          sed -i "s/<span id=\"version-affichee\">.*<\/span>/<span id=\"version-affichee\">${VERSION}<\/span>/" site/index.html
          sed -i "s/<span id=\"version-footer\">.*<\/span>/<span id=\"version-footer\">${VERSION}<\/span>/" site/index.html

      - name: Préparation de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déploiement sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
