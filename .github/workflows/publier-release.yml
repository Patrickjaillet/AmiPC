name: Publication de la release AmiPC

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-et-publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation des dépendances Buildroot
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip rsync bc \
            libncurses-dev python3 cpio file wget libelf-dev flex bison \
            libssl-dev

      - name: Restauration du cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('buildroot-external/configs/amipc_x86_64_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('buildroot-external/configs/amipc_x86_64_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Restauration du cache des sources téléchargées
        uses: actions/cache@v4
        with:
          path: build/buildroot-*/dl
          key: buildroot-dl-2024.02.6-${{ hashFiles('buildroot-external/configs/amipc_x86_64_defconfig') }}
          restore-keys: |
            buildroot-dl-2024.02.6-

      - name: Compilation de l'image AmiPC
        run: sh scripts/construire_image.sh

      - name: Extraction des notes de version depuis CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            BEGIN { trouve=0 }
            $0 ~ "^## \\[" version "\\]" { trouve=1; next }
            trouve && /^## \[/ { exit }
            trouve { print }
          ' CHANGELOG.md > notes_version.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publication de la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: AmiPC ${{ steps.notes.outputs.version }}
          body_path: notes_version.md
          files: build/buildroot-*/output/images/amipc.img
          draft: false
          prerelease: false
