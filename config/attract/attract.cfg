display Amiga 500
	layout amipc
	romlist amiga500
	filter Tous
		sort_by title
	filter A-E
		rule Title starts_with_regexp ^[A-Eé]
	filter F-M
		rule Title starts_with_regexp ^[F-Mî]
	filter N-S
		rule Title starts_with_regexp ^[N-S]
	filter T-Z
		rule Title starts_with_regexp ^[T-Z]
	filter Favoris
		rule Favourite equals 1

display Amiga 1200
	layout amipc
	romlist amiga1200

sound_volume ambient 80
sound_volume movie 100

plugin amipc_about
	enabled yes

plugin amipc_settings
	enabled yes

plugin amipc_bios_check
	enabled yes

input_map
	select		Select
	up			Up, JOY0_UP
	down		Down, JOY0_DOWN
	left		Left, JOY0_LEFT
	right		Right, JOY0_RIGHT
	back		Escape, JOY0_B1
	displays_menu	Tab
	custom2		F1, JOY0_B4
	exit		Escape, hold

general
	language fr
	exit_command /sbin/reboot
	confirm_favourites no
	confirm_exit no
	mouse_threshold 30
	joystick_threshold 75
	window_mode fullscreen
	filter_wrap_mode wrap
