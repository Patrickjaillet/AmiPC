executable         /usr/bin/retroarch
args               -L /usr/lib/libretro/puae_libretro.so --config /data/retroarch/retroarch.cfg --appendconfig /data/retroarch/config/PUAE/amiga500.opt "[romfilename]"
rompath            /data/roms/amiga500
romext             .zip;.adf;.ipf;.dms;.hdf
system             Amiga 500
info_source        thegamesdb
exit_hotkey        F12+Escape
min_run_time       2
artwork            flyer            /data/attract/artwork/amiga500/flyer
artwork            marquee          /data/attract/artwork/amiga500/marquee
artwork            snap             /data/attract/artwork/amiga500/snap
artwork            wheel            /data/attract/artwork/amiga500/wheel
