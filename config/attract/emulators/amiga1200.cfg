executable         /usr/bin/retroarch
args               -L /usr/lib/libretro/puae_libretro.so --config /data/retroarch/retroarch.cfg --appendconfig /data/retroarch/config/PUAE/amiga1200.opt "[romfilename]"
rompath            /data/roms/amiga1200
romext             .zip;.adf;.ipf;.dms;.hdf
system             Amiga 1200
info_source        thegamesdb
exit_hotkey        F12+Escape
min_run_time       2
artwork            flyer            /data/attract/artwork/amiga1200/flyer
artwork            marquee          /data/attract/artwork/amiga1200/marquee
artwork            snap             /data/attract/artwork/amiga1200/snap
artwork            wheel            /data/attract/artwork/amiga1200/wheel
